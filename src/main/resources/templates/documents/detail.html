<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>문서 상세</title>
</head>
<body>
<h1>문서 상세</h1>
<p>제목: <span th:text="${document.title}"></span></p>
<p>작성자: <span th:text="${document.author}"></span></p>
<p>내용: <span th:text="${document.content}"></span></p>
<p>등록일: <span th:text="${document.createdAt}"></span></p>

<a th:href="@{/documents/{id}/edit(id=${document.id})}">수정</a>

<form th:action="@{/documents/{id}/delete(id=${document.id})}" method="post" style="display:inline;">
    <button type="submit" onclick="return confirm('정말 삭제하시겠습니까?')">삭제</button>
</form>

<hr>

<h2>파일 버전 관리</h2>

<form th:action="@{/documents/{id}/versions(id=${document.id})}" method="post" enctype="multipart/form-data">
    <input type="file" name="file" required>
    <button type="submit">새 버전 업로드</button>
</form>

<table border="1">
    <tr>
        <th>버전</th>
        <th>파일명</th>
        <th>업로드 일시</th>
        <th>다운로드</th>
    </tr>
    <tr th:each="v : ${versions}">
        <td th:text="'v' + ${v.versionNumber}"></td>
        <td th:text="${v.originalFileName}"></td>
        <td th:text="${v.uploadedAt}"></td>
        <td>
            <a th:href="@{/documents/versions/{vid}/download(vid=${v.id})}">다운로드</a>
        </td>
    </tr>
</table>

<br>
<a href="/documents">목록으로</a>
</body>
</html>
